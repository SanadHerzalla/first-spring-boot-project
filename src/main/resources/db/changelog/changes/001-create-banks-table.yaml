databaseChangeLog:
  - changeSet:
      id: 001-create-banks-table
      author: sanad

      changes:
        - createTable:
            tableName: banks
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_banks
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: normalized_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: banks
            columnNames: normalized_name
            constraintName: uk_banks_normalized_name